name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write project.yml
        run: |
          cat > project.yml <<'YAML'
          name: VXTube
          options:
            bundleIdPrefix: com.flow
            deploymentTarget:
              iOS: "18.0"
          packages:
            SwiftSoup:
              url: https://github.com/scinfu/SwiftSoup
              from: 2.7.0
          targets:
            VXTube:
              type: application
              platform: iOS
              sources:
                - path: Swift
              dependencies:
                - package: SwiftSoup
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Flow
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
                  UIBackgroundModes: [audio]
                  NSPhotoLibraryAddUsageDescription: Allow Flow to save videos and photos to your photo library.
                  NSSupportsLiveActivities: true
                  ITSAppUsesNonExemptEncryption: false
                  CFBundleURLTypes:
                    - CFBundleURLSchemes: [watchtube]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.flow.vxtube
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.1.0"
                  CURRENT_PROJECT_VERSION: "2"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""

          YAML

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project VXTube.xcodeproj -scheme VXTube \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VXTube.app Payload/
          zip -qr Flow.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-ipa
          path: Flow.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

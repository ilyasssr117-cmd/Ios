name: iOS Build

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VXTube for iOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Clean build artifacts
        run: rm -rf build DerivedData Payload artifacts

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project VXTube.xcodeproj -scheme VXTube -derivedDataPath build/DerivedData

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Validate Swift source encoding
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          files = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.swift"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\0")
          failed = False
          for raw_path in filter(None, files):
              path = os.fsdecode(raw_path)
              data = Path(path).read_bytes()
              if b"\0" in data:
                  print(f"::error file={path}::Swift source contains NUL bytes")
                  failed = True
                  continue
              result = subprocess.run(
                  ["iconv", "-f", "UTF-8", "-t", "UTF-8", path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if result.returncode:
                  print(f"::error file={path}::Swift source is not valid UTF-8")
                  failed = True
          if failed:
              sys.exit(1)
          print(f"Validated UTF-8 for {len(list(filter(None, files)))} tracked Swift files")
          PY

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          mkdir -p build artifacts
          xcodebuild \
            -project VXTube.xcodeproj \
            -scheme VXTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Package IPA
        run: |
          mkdir -p artifacts Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VXTube.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qry artifacts/VXTube.ipa Payload
          cp build/xcodebuild.log artifacts/xcodebuild.log

      - name: Swift build diagnostic summary
        if: failure()
        run: |
          {
            echo '## Swift build diagnostics'
            if [ -f build/xcodebuild.log ]; then
              echo '### Errors and build failures'
              grep -E '^/.*: error:|^error:|crashed' build/xcodebuild.log || true
              echo '### Warnings (excluding SourcePackages)'
              grep -E 'warning:' build/xcodebuild.log | grep -v 'SourcePackages' || true
            else
              echo 'xcodebuild.log was not created.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VXTube-ipa
          path: |
            artifacts/VXTube.ipa
            build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

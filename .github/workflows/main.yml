name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VXTube for iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project VXTube.xcodeproj -scheme VXTube

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          mkdir -p build artifacts
          xcodebuild \
            -project VXTube.xcodeproj \
            -scheme VXTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_ENABLE_BATCH_MODE=NO \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p artifacts Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VXTube.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qry artifacts/VXTube.ipa Payload
          cp build/xcodebuild.log artifacts/xcodebuild.log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VXTube-ipa
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

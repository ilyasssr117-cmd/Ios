name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VXTube for iOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned (not latest-stable) because Xcode 26.3 crashed XCBBuildService.
      # If 26.1 is not available on the runner, try '26.0' or '16.4'.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Clean previous build state
        run: |
          rm -rf build ~/Library/Developer/Xcode/DerivedData
          mkdir -p build artifacts

      - name: Resolve Swift Package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project VXTube.xcodeproj \
            -scheme VXTube \
            -derivedDataPath build/DerivedData

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project VXTube.xcodeproj \
            -scheme VXTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      # Like `flutter analyze`: prints only the real errors and warnings
      # of YOUR code (file:line: message), without the build noise.
      - name: Show code errors (analyze)
        if: failure()
        run: |
          echo "================ ERRORS ================"
          grep -E "^/.*: error:" build/xcodebuild.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u || true
          echo "============== WARNINGS ================"
          grep -E "^/.*: warning:" build/xcodebuild.log | grep -v "SourcePackages" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -50 || true
          echo "========== CRASH / SERVICE ERRORS ======"
          grep -E "^error:|Command .* failed|crashed" build/xcodebuild.log | sort -u || true

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p artifacts Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VXTube.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qry artifacts/VXTube.ipa Payload

      - name: Collect log
        if: always()
        run: |
          mkdir -p artifacts
          cp build/xcodebuild.log artifacts/xcodebuild.log || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VXTube-ipa
          path: artifacts/
          if-no-files-found: error
          retention-days: 14